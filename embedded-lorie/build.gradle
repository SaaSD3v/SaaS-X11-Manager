apply plugin: 'com.android.library'

def upstream = rootProject.file('third_party/termux-x11/lorie')
def upstreamCommit = '139f2197e6093d04d5df1400baa998bf1fb07b3c'

def generatedJava = layout.buildDirectory.dir('generated/embeddedLorie/java')
def generatedRes = layout.buildDirectory.dir('generated/embeddedLorie/res')

android {
    namespace 'com.termux.x11'
    compileSdkVersion 34
    ndkVersion '29.0.14206865'

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        buildConfigField 'String', 'VERSION_NAME', '"embedded-spike"'
        buildConfigField 'String', 'COMMIT', '"' + upstreamCommit + '"'
        buildConfigField 'String', 'APPLICATION_ID', '"com.saas.x11manager"'
        consumerProguardFiles new File(upstream, 'proguard-rules.pro')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path new File(upstream, 'src/main/cpp/CMakeLists.txt')
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    sourceSets {
        main {
            manifest.srcFile new File(upstream, 'src/main/AndroidManifest.xml')
            java.srcDirs new File(upstream, 'src/main/java'), generatedJava
            aidl.srcDirs new File(upstream, 'src/main/aidl')
            res.srcDirs new File(upstream, 'src/main/res'), generatedRes
        }
    }
}

dependencies {
    // Keep this wrapper on the Kotlin/lifecycle generation already used by the
    // Manager instead of forcing the spike to upgrade the whole Android build.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    compileOnly project(':shell-loader:stub')
}

tasks.register('generateEmbeddedLoriePrefs') {
    inputs.file new File(upstream, 'src/main/res/xml/preferences.xml')
    outputs.dir generatedJava

    doLast {
        def source = new File(upstream, 'src/main/res/xml/preferences.xml')
        def xml = groovy.xml.DOMBuilder.parse(new StringReader(source.text))
        def preferenceNodes = xml.documentElement.getElementsByTagName('*')
        def preferences = []

        for (int i = 0; i < preferenceNodes.length; i++) {
            def node = preferenceNodes.item(i)
            if (node.nodeName == 'EditTextPreference' && node.getAttribute('app:key') != 'extra_keys_config')
                preferences << [type: 'String', key: node.getAttribute('app:key'), default: node.getAttribute('app:defaultValue')]
            else if (node.nodeName == 'SeekBarPreference')
                preferences << [type: 'Int', key: node.getAttribute('app:key'), default: node.getAttribute('app:defaultValue')]
            else if (node.nodeName == 'ListPreference') {
                def entries = node.getAttribute('app:entries')
                def values = node.getAttribute('app:entryValues')
                preferences << [
                    type: 'List',
                    key: node.getAttribute('app:key'),
                    default: node.getAttribute('app:defaultValue'),
                    entries: entries.substring(7, entries.length()),
                    values: values.substring(7, values.length())
                ]
            } else if (node.nodeName == 'SwitchPreferenceCompat')
                preferences << [type: 'Boolean', key: node.getAttribute('app:key'), default: node.getAttribute('app:defaultValue')]
        }

        def out = new File(generatedJava.get().asFile, 'com/termux/x11/Prefs.java')
        out.parentFile.mkdirs()
        out.text = 'package com.termux.x11;\n' +
            'import java.util.HashMap;\n' +
            'import android.content.Context;\n' +
            'import android.content.SharedPreferences;\n' +
            'import com.termux.x11.utils.TermuxX11ExtraKeys;\n\n' +
            'public class Prefs extends LoriePreferences.PrefsProto {\n'

        preferences.each {
            if (it.type == 'Int' || it.type == 'Boolean')
                out << "  public final ${it.type}Preference ${it.key} = new ${it.type}Preference(\"${it.key}\", ${it.default});\n"
            else if (it.type == 'String')
                out << "  public final StringPreference ${it.key} = new StringPreference(\"${it.key}\", \"${it.default}\");\n"
            else if (it.type == 'List')
                out << "  public final ${it.type}Preference ${it.key} = new ${it.type}Preference(\"${it.key}\", \"${it.default}\", R.array.${it.entries}, R.array.${it.values});\n"
        }

        out << '  public final StringPreference extra_keys_config = new StringPreference("extra_keys_config", TermuxX11ExtraKeys.DEFAULT_IVALUE_EXTRA_KEYS);\n'
        out << '  public final HashMap<String, Preference> keys = new HashMap<>() {{\n'
        preferences.each { out << '    put("' + it.key + '", ' + it.key + ');\n' }
        out << '    put("extra_keys_config", extra_keys_config);\n'
        out << '  }};\n\n'
        out << '  public Prefs(Context ctx) {\n'
        out << '    super(ctx);\n'
        out << '    for (SharedPreferences store : new SharedPreferences[]{ builtInDisplayPreferences, secondaryDisplayPreferences }) {\n'
        out << '      Object legacyKeepScreenOn = store.getAll().get("keepScreenOn");\n'
        out << '      if (legacyKeepScreenOn instanceof Boolean && !store.contains("screenIdleTimeout"))\n'
        out << '        store.edit().putString("screenIdleTimeout", (Boolean) legacyKeepScreenOn ? "never" : "system").commit();\n'
        out << '    }\n'
        out << '  }\n'
        out << '}\n'
    }
}

tasks.register('generateEmbeddedLorieShortcuts') {
    inputs.file new File(upstream, 'src/main/templates/xml/shortcuts.xml')
    outputs.dir generatedRes

    doLast {
        def out = new File(generatedRes.get().asFile, 'xml/lorie_shortcuts.xml')
        out.parentFile.mkdirs()
        out.text = new File(upstream, 'src/main/templates/xml/shortcuts.xml').text
            .replace('@@APPLICATION_ID@@', 'com.saas.x11manager')
    }
}

afterEvaluate {
    preBuild.dependsOn generateEmbeddedLoriePrefs
    preBuild.dependsOn generateEmbeddedLorieShortcuts
}
