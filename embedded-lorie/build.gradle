apply plugin: 'com.android.library'

def upstream = rootProject.file('third_party/termux-x11/lorie')
def upstreamCommit = '139f2197e6093d04d5df1400baa998bf1fb07b3c'

def generatedUpstreamJava = layout.buildDirectory.dir('generated/embeddedLorie/upstreamJava')
def generatedPrefsJava = layout.buildDirectory.dir('generated/embeddedLorie/prefsJava')
def generatedRes = layout.buildDirectory.dir('generated/embeddedLorie/res')

android {
    namespace 'com.termux.x11'
    compileSdkVersion 34
    ndkVersion '29.0.14206865'

    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 34
        buildConfigField 'String', 'VERSION_NAME', '"manager-embedded"'
        buildConfigField 'String', 'COMMIT', '"' + upstreamCommit + '"'
        buildConfigField 'String', 'APPLICATION_ID', '"com.saas.x11manager"'
        consumerProguardFiles new File(upstream, 'proguard-rules.pro')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path new File(upstream, 'src/main/cpp/CMakeLists.txt')
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    sourceSets {
        main {
            manifest.srcFile new File(upstream, 'src/main/AndroidManifest.xml')
            java.srcDirs generatedUpstreamJava, generatedPrefsJava, 'src/main/java'
            aidl.srcDirs new File(upstream, 'src/main/aidl')
            res.srcDirs new File(upstream, 'src/main/res'), generatedRes
        }
    }
}

dependencies {
    // Keep this wrapper on the Kotlin/lifecycle generation already used by the
    // Manager instead of forcing an unrelated whole-project Android upgrade.
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.22'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    // LoriePreferences/Prefs are part of the embedded module's public API and
    // are referenced directly by the Manager's Display screen.
    api 'androidx.preference:preference:1.2.1'
    compileOnly project(':shell-loader:stub')
}

tasks.register('prepareEmbeddedLorieJava') {
    inputs.dir new File(upstream, 'src/main/java')
    outputs.dir generatedUpstreamJava

    doLast {
        def output = generatedUpstreamJava.get().asFile
        delete output
        copy {
            from new File(upstream, 'src/main/java')
            into output
        }

        // The upstream renderer is reusable, but its Java view assumes that a
        // Termux:X11 MainActivity owns it. For the Manager we keep the upstream
        // source pinned and generate a tiny host adaptation at build time rather
        // than carrying a forked copy of the whole renderer.
        def lorie = new File(output, 'com/termux/x11/LorieView.java')
        def source = lorie.getText('UTF-8')

        def replacements = [
            ['if (a.useTermuxEKBarBehaviour && a.mExtraKeys != null)',
             'if (a != null && a.useTermuxEKBarBehaviour && a.mExtraKeys != null)'],
            ['Prefs prefs = MainActivity.getPrefs();',
             'Prefs prefs = EmbeddedDisplayHost.getPrefs(getContext());'],
            ['SamsungDexUtils.checkDeXEnabled(MainActivity.getInstance())',
             'SamsungDexUtils.checkDeXEnabled(getContext())'],
            ['MainActivity.handler.post(() -> {\n            MainActivity activity = MainActivity.getInstance();\n            if (activity == null)\n                return;\n\n            LorieView view = activity.getLorieView();',
             'EmbeddedDisplayHost.handler.post(() -> {\n            LorieView view = EmbeddedDisplayHost.getActiveView();\n            if (view == null)\n                return;'],
            ['return MainActivity.getInstance().handleKey(event);',
             'MainActivity activity = MainActivity.getInstance();\n        return activity != null ? activity.handleKey(event) : EmbeddedDisplayHost.handleKey(this, event);'],
            ['if (MainActivity.getPrefs().enforceCharBasedInput.get())',
             'if (EmbeddedDisplayHost.getPrefs(getContext()).enforceCharBasedInput.get())'],
            ['TouchInputHandler.refreshInputDevices();',
             'EmbeddedDisplayHost.refreshInputDevices(this);'],
            ['mNativeContext = nativeInit();',
             'mNativeContext = nativeInit();\n        EmbeddedDisplayHost.attach(this);'],
            ['super.onDetachedFromWindow();\n        nativeDestroy(mNativeContext);',
             'super.onDetachedFromWindow();\n        EmbeddedDisplayHost.detach(this);\n        nativeDestroy(mNativeContext);']
        ]

        replacements.each { pair ->
            if (!source.contains(pair[0]))
                throw new GradleException('Pinned LorieView host patch no longer matches upstream source: ' + pair[0])
            source = source.replace(pair[0], pair[1])
        }
        if (source.contains('MainActivity.getPrefs()') || source.contains('MainActivity.handler.post'))
            throw new GradleException('Unadapted MainActivity dependency remains in embedded LorieView')
        lorie.setText(source, 'UTF-8')

        def receiver = new File(output, 'com/termux/x11/LorieBroadcastReceiver.java')
        def receiverSource = receiver.getText('UTF-8')
        def oldReceiver = '        else\n            Log.w("LorieBroadcastReceiver", "Got " + intent.getAction() + " but no MainActivity instance in this process");'
        def newReceiver = '        else\n            EmbeddedDisplayHost.onBroadcastReceive(context, intent);'
        if (!receiverSource.contains(oldReceiver))
            throw new GradleException('Pinned LorieBroadcastReceiver host patch no longer matches upstream source')
        receiver.setText(receiverSource.replace(oldReceiver, newReceiver), 'UTF-8')

        // Upstream CmdEntryPoint assumes that only one server instance exists.
        // The Manager can run several displays, so make each Binder broadcast
        // identify the exact X11 display passed on the app_process command line.
        def cmdEntryPoint = new File(output, 'com/termux/x11/CmdEntryPoint.java')
        def cmdSource = cmdEntryPoint.getText('UTF-8')
        def cmdReplacements = [
            ['private final Intent intent = createIntent();',
             'private final Intent intent;'],
            ['CmdEntryPoint(String[] args) {\n        if (!start(args))',
             'CmdEntryPoint(String[] args) {\n        intent = createIntent(args.length > 0 ? args[0] : ":0");\n        if (!start(args))'],
            ['private Intent createIntent() {',
             'private Intent createIntent(String displayName) {'],
            ['intent.setPackage(BuildConfig.APPLICATION_ID);',
             'intent.setPackage(BuildConfig.APPLICATION_ID);\n        intent.putExtra(EmbeddedDisplayHost.EXTRA_X11_DISPLAY, displayName);']
        ]
        cmdReplacements.each { pair ->
            if (!cmdSource.contains(pair[0]))
                throw new GradleException('Pinned CmdEntryPoint multi-display patch no longer matches upstream source: ' + pair[0])
            cmdSource = cmdSource.replace(pair[0], pair[1])
        }
        cmdEntryPoint.setText(cmdSource, 'UTF-8')
    }
}

tasks.register('generateEmbeddedLoriePrefs') {
    inputs.file new File(upstream, 'src/main/res/xml/preferences.xml')
    outputs.dir generatedPrefsJava

    doLast {
        def source = new File(upstream, 'src/main/res/xml/preferences.xml')
        def xml = groovy.xml.DOMBuilder.parse(new StringReader(source.text))
        def preferenceNodes = xml.documentElement.getElementsByTagName('*')
        def preferences = []

        for (int i = 0; i < preferenceNodes.length; i++) {
            def node = preferenceNodes.item(i)
            if (node.nodeName == 'EditTextPreference' && node.getAttribute('app:key') != 'extra_keys_config')
                preferences << [type: 'String', key: node.getAttribute('app:key'), default: node.getAttribute('app:defaultValue')]
            else if (node.nodeName == 'SeekBarPreference')
                preferences << [type: 'Int', key: node.getAttribute('app:key'), default: node.getAttribute('app:defaultValue')]
            else if (node.nodeName == 'ListPreference') {
                def entries = node.getAttribute('app:entries')
                def values = node.getAttribute('app:entryValues')
                preferences << [
                    type: 'List',
                    key: node.getAttribute('app:key'),
                    default: node.getAttribute('app:defaultValue'),
                    entries: entries.substring(7, entries.length()),
                    values: values.substring(7, values.length())
                ]
            } else if (node.nodeName == 'SwitchPreferenceCompat')
                preferences << [type: 'Boolean', key: node.getAttribute('app:key'), default: node.getAttribute('app:defaultValue')]
        }

        def out = new File(generatedPrefsJava.get().asFile, 'com/termux/x11/Prefs.java')
        out.parentFile.mkdirs()
        out.text = 'package com.termux.x11;\n' +
            'import java.util.HashMap;\n' +
            'import android.content.Context;\n' +
            'import android.content.SharedPreferences;\n' +
            'import com.termux.x11.utils.TermuxX11ExtraKeys;\n\n' +
            'public class Prefs extends LoriePreferences.PrefsProto {\n'

        preferences.each {
            if (it.type == 'Int' || it.type == 'Boolean')
                out << "  public final ${it.type}Preference ${it.key} = new ${it.type}Preference(\"${it.key}\", ${it.default});\n"
            else if (it.type == 'String')
                out << "  public final StringPreference ${it.key} = new StringPreference(\"${it.key}\", \"${it.default}\");\n"
            else if (it.type == 'List')
                out << "  public final ${it.type}Preference ${it.key} = new ${it.type}Preference(\"${it.key}\", \"${it.default}\", R.array.${it.entries}, R.array.${it.values});\n"
        }

        out << '  public final StringPreference extra_keys_config = new StringPreference("extra_keys_config", TermuxX11ExtraKeys.DEFAULT_IVALUE_EXTRA_KEYS);\n'
        out << '  public final HashMap<String, Preference> keys = new HashMap<>() {{\n'
        preferences.each { out << '    put("' + it.key + '", ' + it.key + ');\n' }
        out << '    put("extra_keys_config", extra_keys_config);\n'
        out << '  }};\n\n'
        out << '  public Prefs(Context ctx) {\n'
        out << '    super(ctx);\n'
        out << '    for (SharedPreferences store : new SharedPreferences[]{ builtInDisplayPreferences, secondaryDisplayPreferences }) {\n'
        out << '      Object legacyKeepScreenOn = store.getAll().get("keepScreenOn");\n'
        out << '      if (legacyKeepScreenOn instanceof Boolean && !store.contains("screenIdleTimeout"))\n'
        out << '        store.edit().putString("screenIdleTimeout", (Boolean) legacyKeepScreenOn ? "never" : "system").commit();\n'
        out << '    }\n'
        out << '  }\n'
        out << '}\n'
    }
}

tasks.register('generateEmbeddedLorieShortcuts') {
    inputs.file new File(upstream, 'src/main/templates/xml/shortcuts.xml')
    outputs.dir generatedRes

    doLast {
        def out = new File(generatedRes.get().asFile, 'xml/lorie_shortcuts.xml')
        out.parentFile.mkdirs()
        out.text = new File(upstream, 'src/main/templates/xml/shortcuts.xml').text
            .replace('@@APPLICATION_ID@@', 'com.saas.x11manager')
    }
}

afterEvaluate {
    preBuild.dependsOn prepareEmbeddedLorieJava
    preBuild.dependsOn generateEmbeddedLoriePrefs
    preBuild.dependsOn generateEmbeddedLorieShortcuts
}
