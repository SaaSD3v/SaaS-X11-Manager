name: X11 Only CI

on:
  push:
    branches:
      - "X11-0nly"
  workflow_dispatch:

concurrency:
  group: x11-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify fixed X0 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Verify single-display source contract
        run: bash scripts/verify-x11-only.sh

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease

      - name: Generate APK checksums
        if: ${{ success() }}
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload installable APKs
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: x11-only-apk-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: x11-only-ci-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/test-results/**/*.xml
            app/build/outputs/apk/release/output-metadata.json
