name: X11 Only CI

on:
  push:
    branches:
      - "X11-0nly"
  workflow_dispatch:

concurrency:
  group: x11-only-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify fixed X0 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache integrated X11 native build
        uses: actions/cache@v4
        with:
          path: embedded-lorie/build/.cxx
          key: ${{ runner.os }}-x11-only-native-${{ hashFiles('embedded-lorie/build.gradle', 'third_party/termux-x11/lorie/src/main/cpp/**') }}

      - name: Verify single-display source contract
        run: bash scripts/verify-x11-only.sh

      - name: Install real PulseAudio transport test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils alsa-utils libasound2-plugins

      - name: Build the real DroidSpaces audio request parser
        run: |
          set -euo pipefail
          audio_fixture_dir="$RUNNER_TEMP/saas-audio-protocol"
          mkdir -p "$audio_fixture_dir"
          upstream="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/f60294ac4c8aa2cc860773ac85bc5790104eb77f/src"
          curl --fail --silent --show-error --location "$upstream/daemon.c" -o "$audio_fixture_dir/daemon.c"
          curl --fail --silent --show-error --location "$upstream/include/droidspace.h" -o "$audio_fixture_dir/droidspace.h"
          printf '%s  %s\n' \
            3357017c7c56bac0bd5fd76125f6534e3a51f2dd2b90aa65070a07c75be280eb "$audio_fixture_dir/daemon.c" \
            4cc3466f2cf799ba018d36b7067766452554b612e3fb1d9ec2915b0d80aafb1f "$audio_fixture_dir/droidspace.h" | sha256sum --check
          cc -O2 -ffunction-sections -fdata-sections -I"$audio_fixture_dir" \
            app/src/test/native/droidspaces_audio_request.c -Wl,--gc-sections \
            -o "$audio_fixture_dir/droidspaces-audio-request"
          printf 'SAAS_DROIDSPACES_AUDIO_FIXTURE=%s\n' "$audio_fixture_dir/droidspaces-audio-request" >> "$GITHUB_ENV"

      - name: Build and test
        env:
          SAAS_PULSE_INTEGRATION_REQUIRED: "1"
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease -PVERSION_CODE=${{ github.run_number }}

      - name: Generate APK checksums
        if: ${{ success() }}
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload installable APKs
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: x11-only-apk-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: x11-only-ci-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            app/build/test-results/**/*.xml
            app/build/outputs/apk/release/output-metadata.json
