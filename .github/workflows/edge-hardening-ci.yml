name: X11-X0TEST CI

on:
  push:
    branches:
      - "X11-X0TEST"
  workflow_dispatch:

concurrency:
  group: x11-x0test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build X11-X0TEST APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Cache native builds
        uses: actions/cache@v4
        with:
          path: |
            embedded-lorie/.cxx
            embedded-avnc/.cxx
          key: ${{ runner.os }}-x11-x0test-native-${{ hashFiles('embedded-lorie/build.gradle', 'embedded-avnc/build.gradle', 'build.gradle.kts', 'settings.gradle.kts', 'third_party/termux-x11/lorie/src/main/cpp/**', 'third_party/avnc/app/src/main/cpp/**', 'third_party/avnc/app/CMakeLists.txt') }}

      - name: Verify fixed X0 source contract
        run: bash scripts/verify-x11-only.sh

      - name: Validate pinned embedded AVNC engine
        run: |
          set -euo pipefail
          expected=f30406514ef8880097e960da7dc1d8dc4c713d7f
          actual=$(git -C third_party/avnc rev-parse HEAD)
          [ "$actual" = "$expected" ] || { echo "::error::AVNC pin mismatch: $actual"; exit 1; }
          test -f third_party/avnc/COPYING.txt
          test -f third_party/avnc/app/CMakeLists.txt
          test -f third_party/avnc/app/src/main/cpp/native-vnc.cpp
          test -f third_party/avnc/app/src/main/java/com/gaurav/avnc/vnc/VncClient.kt
          test -f third_party/avnc/extern/libvncserver/CMakeLists.txt
          test -f third_party/avnc/extern/libjpeg-turbo/CMakeLists.txt
          test -f third_party/avnc/extern/wolfssl/CMakeLists.txt
          grep -q 'setFrameBufferUpdatesPaused' third_party/avnc/app/src/main/java/com/gaurav/avnc/vnc/VncClient.kt
          ! grep -R -E 'VncServerManager|ContainerManager|X11SessionManager|Droidspaces' app/src/main/java/com/saas/x11manager/ui/screen/vnc embedded-avnc/src/main/java

      - name: Install PulseAudio test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils alsa-utils libasound2-plugins

      - name: Build pinned DroidSpaces audio request parser
        run: |
          set -euo pipefail
          audio_fixture_dir="$RUNNER_TEMP/saas-audio-protocol"
          mkdir -p "$audio_fixture_dir"
          upstream="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/f60294ac4c8aa2cc860773ac85bc5790104eb77f/src"
          curl --fail --silent --show-error --location "$upstream/daemon.c" -o "$audio_fixture_dir/daemon.c"
          curl --fail --silent --show-error --location "$upstream/include/droidspace.h" -o "$audio_fixture_dir/droidspace.h"
          printf '%s  %s\n' \
            3357017c7c56bac0bd5fd76125f6534e3a51f2dd2b90aa65070a07c75be280eb "$audio_fixture_dir/daemon.c" \
            4cc3466f2cf799ba018d36b7067766452554b612e3fb1d9ec2915b0d80aafb1f "$audio_fixture_dir/droidspace.h" | sha256sum --check
          cc -O2 -ffunction-sections -fdata-sections -I"$audio_fixture_dir" \
            app/src/test/native/droidspaces_audio_request.c -Wl,--gc-sections \
            -o "$audio_fixture_dir/droidspaces-audio-request"
          printf 'SAAS_DROIDSPACES_AUDIO_FIXTURE=%s\n' "$audio_fixture_dir/droidspaces-audio-request" >> "$GITHUB_ENV"

      - name: Run unit tests and build release APKs
        env:
          SAAS_PULSE_INTEGRATION_REQUIRED: "1"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease \
            -PVERSION_NAME="1.0.0-x0test" \
            -PVERSION_CODE=${{ github.run_number }} \
            2>&1 | tee edge-gradle.log

      - name: Validate APK set and checksums
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          count=$(find . -maxdepth 1 -type f -name '*.apk' | wc -l)
          [ "$count" -eq 5 ] || { echo "::error::Expected 5 APKs, found $count"; exit 1; }
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload installable APKs
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: x11-x0test-apk-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/apk/release/SHA256SUMS.txt

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: x11-x0test-ci-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            edge-gradle.log
            app/build/test-results/**/*.xml


      - name: Upload APKs individually to GoFile
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_APK_ROOT: app/build/outputs/apk/release
        run: |
          set -euo pipefail
          if [ -z "${GOFILE_TOKEN:-}" ]; then
            echo "::warning::GOFILE_TOKEN repository secret is not configured; skipping GoFile upload."
            exit 0
          fi
          test -d "$GOFILE_APK_ROOT"
          mapfile -d '' apks < <(find "$GOFILE_APK_ROOT" -type f -name '*.apk' -print0 | sort -z)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK files found under $GOFILE_APK_ROOT"
            exit 1
          fi
          server_json="$(curl --silent --show-error --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors https://api.gofile.io/servers)"
          upload_server="$(printf '%s' "$server_json" | python3 -c 'import json,sys; j=json.load(sys.stdin); s=(j.get("data") or {}).get("servers") or []; print((s[0] or {}).get("name","") if s else "")')"
          test -n "$upload_server" || { echo "::error::GoFile returned no upload server"; exit 1; }
          upload_url="https://$upload_server.gofile.io/contents/uploadfile"
          folder_id=""
          folder_page=""
          uploaded=0
          summary="$RUNNER_TEMP/gofile-apks.md"
          : > "$summary"
          for apk in "${apks[@]}"; do
            args=(--silent --show-error --fail-with-body --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 900
              -H "Authorization: Bearer $GOFILE_TOKEN"
              -F "file=@$apk")
            if [ -n "$folder_id" ]; then args+=(-F "folderId=$folder_id"); fi
            response="$(curl "${args[@]}" "$upload_url")"
            mapfile -t meta < <(printf '%s' "$response" | python3 -c 'import json,sys; j=json.load(sys.stdin); d=j.get("data") or {}; print(j.get("status","")); print(d.get("parentFolder") or d.get("folderId") or ""); print(d.get("downloadPage","")); print(d.get("parentFolderCode") or d.get("folderCode") or "")')
            status="${meta[0]:-}"; parent="${meta[1]:-}"; page="${meta[2]:-}"; parent_code="${meta[3]:-}"
            if [ "$status" != "ok" ]; then echo "::error::GoFile rejected $(basename "$apk")"; printf '%s\n' "$response" >&2; exit 1; fi
            if [ -z "$folder_id" ]; then folder_id="$parent"; fi
            if [ -z "$folder_page" ] && [ -n "$parent_code" ]; then folder_page="https://gofile.io/d/$parent_code"; fi
            name="$(basename "$apk")"
            if [ -n "$page" ]; then printf -- '- [%s](%s)\n' "$name" "$page" >> "$summary"; else printf -- '- %s\n' "$name" >> "$summary"; fi
            uploaded=$((uploaded + 1))
          done
          { echo "### GoFile — $uploaded APKs uploaded individually"; [ -z "$folder_page" ] || echo "Folder: $folder_page"; echo; cat "$summary"; } >> "$GITHUB_STEP_SUMMARY"