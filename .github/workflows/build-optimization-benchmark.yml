name: Build Optimization Benchmark

on:
  push:
    branches:
      - "test/build-optimization-benchmark"
  workflow_dispatch:

concurrency:
  group: build-optimization-benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  SAAS_NATIVE_LTO: "1"

jobs:
  cold:
    name: Cold optimized release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle caches
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Cache native CMake state
        uses: actions/cache@v4
        with:
          path: |
            embedded-lorie/.cxx
            embedded-avnc/.cxx
          key: ${{ runner.os }}-native-cxx-opt-v1-${{ hashFiles('embedded-lorie/build.gradle', 'embedded-avnc/build.gradle', 'third_party/termux-x11/lorie/src/main/cpp/**', 'third_party/avnc/app/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-native-cxx-opt-v1-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-opt-v1-${{ hashFiles('embedded-lorie/build.gradle', 'embedded-avnc/build.gradle', 'third_party/termux-x11/lorie/src/main/cpp/**', 'third_party/avnc/app/CMakeLists.txt', 'third_party/avnc/extern/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-opt-v1-

      - name: Install native and audio test tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             ccache pulseaudio pulseaudio-utils alsa-utils libasound2-plugins
          echo "CCACHE_EXECUTABLE=$(command -v ccache)" >> "$GITHUB_ENV"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats

      - name: Build real DroidSpaces audio request parser
        run: |
          set -euo pipefail
          audio_fixture_dir="$RUNNER_TEMP/saas-audio-protocol"
          mkdir -p "$audio_fixture_dir"
          upstream="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/f60294ac4c8aa2cc860773ac85bc5790104eb77f/src"
          curl --fail --silent --show-error --location "$upstream/daemon.c" -o "$audio_fixture_dir/daemon.c"
          curl --fail --silent --show-error --location "$upstream/include/droidspace.h" -o "$audio_fixture_dir/droidspace.h"
          printf '%s  %s\n'             3357017c7c56bac0bd5fd76125f6534e3a51f2dd2b90aa65070a07c75be280eb "$audio_fixture_dir/daemon.c"             4cc3466f2cf799ba018d36b7067766452554b612e3fb1d9ec2915b0d80aafb1f "$audio_fixture_dir/droidspace.h" | sha256sum --check
          cc -O2 -ffunction-sections -fdata-sections -I"$audio_fixture_dir"             app/src/test/native/droidspaces_audio_request.c -Wl,--gc-sections             -o "$audio_fixture_dir/droidspaces-audio-request"
          echo "SAAS_DROIDSPACES_AUDIO_FIXTURE=$audio_fixture_dir/droidspaces-audio-request" >> "$GITHUB_ENV"

      - name: Build and time optimized release
        env:
          SAAS_PULSE_INTEGRATION_REQUIRED: "1"
        run: |
          set -euo pipefail
          chmod +x gradlew
          start=$(date +%s)
          ./gradlew testReleaseUnitTest assembleRelease             --build-cache --parallel --profile             -PcomposeCompilerReports=true             -PVERSION_NAME=1.0.0-opt-test             -PVERSION_CODE=${{ github.run_number }}             2>&1 | tee gradle-opt-cold.log
          end=$(date +%s)
          echo "$((end-start))" | tee build-seconds.txt
          echo "Cold Gradle build: $((end-start)) seconds"

      - name: Validate APK set and 16 KB ZIP alignment
        run: |
          set -euo pipefail
          mapfile -d '' apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0 | sort -z)
          [ "${#apks[@]}" -eq 5 ] || {
            echo "::error::Expected 5 APKs, got ${#apks[@]}"
            exit 1
          }
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          [ -x "$ZIPALIGN" ] || { echo "::error::zipalign not found"; exit 1; }
          : > apk-sizes.txt
          for apk in "${apks[@]}"; do
            "$ZIPALIGN" -c -P 16 -v 4 "$apk" >/dev/null
            stat -c '%n %s' "$apk" | tee -a apk-sizes.txt
          done
          echo "All APKs pass 16 KB page-alignment validation."

      - name: Report ccache effectiveness
        run: |
          ccache --show-stats --verbose | tee ccache-stats.txt

      - name: Collect quality artifacts
        if: ${{ always() }}
        run: |
          mkdir -p benchmark
          cp -f gradle-opt-cold.log benchmark/ 2>/dev/null || true
          cp -f build-seconds.txt benchmark/ 2>/dev/null || true
          cp -f apk-sizes.txt benchmark/ 2>/dev/null || true
          cp -f ccache-stats.txt benchmark/ 2>/dev/null || true
          cp -f app/build/outputs/mapping/release/mapping.txt benchmark/ 2>/dev/null || true
          mkdir -p benchmark/gradle-profile benchmark/compose-compiler
          find build/reports/profile -maxdepth 1 -type f -exec cp -f {} benchmark/gradle-profile/ \; 2>/dev/null || true
          find app/build/compose-compiler -type f -exec cp -f {} benchmark/compose-compiler/ \; 2>/dev/null || true
          find app/build/outputs -type f -name 'native-debug-symbols.zip' -exec cp -f {} benchmark/ \; 2>/dev/null || true

      - name: Upload cold benchmark
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-opt-cold-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            benchmark/
            app/build/outputs/apk/release/*.apk

  warm:
    name: Warm-cache optimized release build
    needs: cold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle caches
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore native CMake state
        uses: actions/cache@v4
        with:
          path: |
            embedded-lorie/.cxx
            embedded-avnc/.cxx
          key: ${{ runner.os }}-native-cxx-opt-v1-${{ hashFiles('embedded-lorie/build.gradle', 'embedded-avnc/build.gradle', 'third_party/termux-x11/lorie/src/main/cpp/**', 'third_party/avnc/app/CMakeLists.txt') }}
          restore-keys: |
