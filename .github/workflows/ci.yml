name: X11 Manager CI

on:
  push:
    branches: [ "main", "master", "agent/structural-fixes", "agent/integrated-x11", "agent/multi-display" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Tag name'
        required: false
        default: 'test'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Mark branch CI pending
      if: ${{ github.event_name == 'push' }}
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'pending',
            context: 'x11-manager-ci',
            description: 'Unit tests and release build are running',
            target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          })

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache integrated X11 native build
      uses: actions/cache@v4
      with:
        path: embedded-lorie/build/.cxx
        key: ${{ runner.os }}-x11-native-${{ hashFiles('embedded-lorie/build.gradle', 'build.gradle.kts', 'settings.gradle.kts', 'third_party/termux-x11/lorie/src/main/cpp/**') }}

    - name: Validate integrated X11 source
      if: ${{ github.ref == 'refs/heads/agent/integrated-x11' || github.ref == 'refs/heads/agent/multi-display' }}
      run: |
        test -f third_party/termux-x11/lorie/src/main/cpp/CMakeLists.txt
        test -f third_party/termux-x11/lorie/src/main/java/com/termux/x11/CmdEntryPoint.java
        test -f third_party/termux-x11/LICENSE

    - name: Require release signing material
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        missing=0
        for name in RELEASE_KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          eval "value=\${$name:-}"
          if [ -z "$value" ]; then
            echo "::error::$name is required for a signed release"
            missing=1
          fi
        done
        [ "$missing" -eq 0 ] || exit 1
        echo "Release signing material is present."

    - name: Decode Keystore
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      if: "${{ env.RELEASE_KEYSTORE != '' }}"
      run: |
        printf '%s' "${RELEASE_KEYSTORE}" | base64 -d > x11manager.keystore
        test -s x11manager.keystore
        chmod 600 x11manager.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Test and build Android App with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -o pipefail
        ./gradlew testReleaseUnitTest assembleRelease \
          -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
          -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
          -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}" \
          2>&1 | tee gradle-ci.log

    - name: Verify release APK signatures
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true' }}
      run: |
        set -euo pipefail
        APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
        [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ] || {
          echo "::error::apksigner was not found in the Android SDK"
          exit 1
        }
        mkdir -p signing
        : > signing/SIGNING.txt
        found=0
        while IFS= read -r -d '' apk; do
          found=1
          echo "### $(basename "$apk")" | tee -a signing/SIGNING.txt
          "$APKSIGNER" verify --verbose --print-certs "$apk" | tee -a signing/SIGNING.txt
          echo | tee -a signing/SIGNING.txt
        done < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0)
        [ "$found" -eq 1 ] || {
          echo "::error::No release APK was produced"
          exit 1
        }

    - name: Upload CI diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: x11manager-ci-diagnostics-${{ github.run_id }}
        if-no-files-found: warn
        path: |
          gradle-ci.log
          app/build/test-results/**/*.xml
          signing/SIGNING.txt

    - name: Stage & Rename Artifacts
      run: |
        set -euo pipefail
        TAG="${{ github.event.inputs.tag_name || 'CI' }}"
        COMMIT_HASH=$(git log -1 --pretty=%h)
        mkdir -p dist
        found=0
        while IFS= read -r -d '' apk; do
          found=1
          original=$(basename "$apk" .apk)
          mv "$apk" "dist/X11Manager-${TAG}-${COMMIT_HASH}-${original}.apk"
        done < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0)
        [ "$found" -eq 1 ] || {
          echo "::error::No release APK was available for staging"
          exit 1
        }
        (
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
        )
        if [ -s signing/SIGNING.txt ]; then
          cp signing/SIGNING.txt dist/SIGNING.txt
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: x11manager-artifacts
        path: dist/

    - name: Publish branch CI result
      if: ${{ always() && github.event_name == 'push' }}
      uses: actions/github-script@v7
      with:
        script: |
          const succeeded = '${{ job.status }}' === 'success';
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: succeeded ? 'success' : 'failure',
            context: 'x11-manager-ci',
            description: succeeded
              ? 'Unit tests and release build passed'
              : 'Unit tests or release build failed',
            target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          })

  release:
    name: Create GitHub Release
    needs: [build]
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.create_release == 'true' &&
      github.event.inputs.tag_name != '' &&
      github.event.inputs.tag_name != 'test'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: Generate Changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          CHANGELOG=$(git log --oneline --pretty=format:"* %s (%h)")
        else
          CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline --pretty=format:"* %s (%h)")
        fi
        {
          echo "notes<<EOF"
          echo "$CHANGELOG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.inputs.tag_name }}
        name: X11 Manager ${{ github.event.inputs.tag_name }}
        target_commitish: ${{ github.sha }}
        body: |
          ## What's Changed
          ${{ steps.changelog.outputs.notes }}

          ## Verification
          Every published APK was verified with Android SDK `apksigner` before this release job was allowed to run. SHA-256 checksums and signer details are included with the assets.

          ---
          **Automated Release by X11 Manager CI**
        files: |
          release-assets/*.apk
          release-assets/SHA256SUMS.txt
          release-assets/SIGNING.txt
