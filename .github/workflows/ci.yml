name: X11 Manager CI

on:
  push:
    branches:
      - "main"
      - "master"
      - "agent/structural-fixes"
      - "agent/integrated-x11"
      - "agent/multi-display"
      - "release/**"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release?'
        required: true
        type: boolean
        default: false
      tag_name:
        description: 'Tag name (for example v1.0.0)'
        required: false
        default: 'test'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 1

    - name: Mark branch CI pending
      if: ${{ github.event_name == 'push' }}
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'pending',
            context: 'x11-manager-ci',
            description: 'Unit tests and release build are running',
            target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          })

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Cache integrated X11 native build
      uses: actions/cache@v4
      with:
        path: embedded-lorie/build/.cxx
        key: ${{ runner.os }}-x11-native-${{ hashFiles('embedded-lorie/build.gradle', 'build.gradle.kts', 'settings.gradle.kts', 'third_party/termux-x11/lorie/src/main/cpp/**') }}

    - name: Validate integrated X11 source
      if: ${{ github.ref == 'refs/heads/agent/integrated-x11' || github.ref == 'refs/heads/agent/multi-display' || startsWith(github.ref, 'refs/heads/release/') }}
      run: |
        test -f third_party/termux-x11/lorie/src/main/cpp/CMakeLists.txt
        test -f third_party/termux-x11/lorie/src/main/java/com/termux/x11/CmdEntryPoint.java
        test -f third_party/termux-x11/LICENSE

    - name: Require release signing material
      if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || startsWith(github.ref, 'refs/heads/release/') }}
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
      run: |
        set -euo pipefail
        missing=0
        for name in RELEASE_KEYSTORE KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD RELEASE_CERT_SHA256; do
          eval "value=\${$name:-}"
          if [ -z "$value" ]; then
            echo "::error::$name is required for a signed release"
            missing=1
          fi
        done
        [ "$missing" -eq 0 ] || exit 1
        echo "Release signing material and expected certificate fingerprint are present."

    - name: Decode Keystore
      if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || startsWith(github.ref, 'refs/heads/release/') }}
      env:
        RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
      run: |
        set -euo pipefail
        printf '%s' "${RELEASE_KEYSTORE}" | base64 -d > x11manager.keystore
        test -s x11manager.keystore
        chmod 600 x11manager.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Test and build Android App with Gradle
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -euo pipefail
        VERSION_NAME="1.0.0"
        RELEASE_TAG="CI"

        if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
          RELEASE_TAG="${GITHUB_REF#refs/heads/release/}"
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release branches must be named release/vMAJOR.MINOR.PATCH"
            exit 1
          fi
          VERSION_NAME="${RELEASE_TAG#v}"
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ github.event.inputs.create_release }}" = "true" ]; then
          RELEASE_TAG="${{ github.event.inputs.tag_name }}"
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::A semantic release tag such as v1.0.0 is required"
            exit 1
          fi
          VERSION_NAME="${RELEASE_TAG#v}"
        fi

        VERSION_CODE="${{ github.run_number }}"
        echo "Building versionName=${VERSION_NAME} versionCode=${VERSION_CODE} releaseTag=${RELEASE_TAG}"
        ./gradlew testReleaseUnitTest assembleRelease \
          -PVERSION_NAME="$VERSION_NAME" \
          -PVERSION_CODE="$VERSION_CODE" \
          2>&1 | tee gradle-ci.log
        printf '%s\n' "$VERSION_NAME" > .ci-version-name
        printf '%s\n' "$VERSION_CODE" > .ci-version-code
        printf '%s\n' "$RELEASE_TAG" > .ci-release-tag

    - name: Validate multi-ABI APK set
      run: |
        set -euo pipefail
        mapfile -d '' apks < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0 | sort -z)
        if [ "${#apks[@]}" -ne 5 ]; then
          echo "::error::Expected 5 release APKs (4 ABI-specific + universal), found ${#apks[@]}"
          printf '  %s\n' "${apks[@]:-none}"
          exit 1
        fi
        for variant in arm64-v8a armeabi-v7a x86 x86_64 universal; do
          found=0
          for apk in "${apks[@]}"; do
            if [[ "$(basename "$apk")" == *"$variant"* ]]; then
              found=1
              break
            fi
          done
          [ "$found" -eq 1 ] || {
            echo "::error::Missing release APK variant: $variant"
            exit 1
          }
        done
        echo "Validated 4 ABI-specific APKs plus universal APK."

    - name: Verify release APK signatures
      if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || startsWith(github.ref, 'refs/heads/release/') }}
      env:
        RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
      run: |
        set -euo pipefail
        APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n 1)
        [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ] || {
          echo "::error::apksigner was not found in the Android SDK"
          exit 1
        }
        expected=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ' :\r\n' | tr '[:upper:]' '[:lower:]')
        [ "${#expected}" -eq 64 ] || {
          echo "::error::RELEASE_CERT_SHA256 must contain the 64-hex SHA-256 certificate fingerprint"
          exit 1
        }
        mkdir -p signing
        : > signing/SIGNING.txt
        found=0
        while IFS= read -r -d '' apk; do
          found=1
          echo "### $(basename "$apk")" | tee -a signing/SIGNING.txt
          verify_output=$("$APKSIGNER" verify --verbose --print-certs "$apk")
          printf '%s\n' "$verify_output" | tee -a signing/SIGNING.txt
          actual=$(printf '%s\n' "$verify_output" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | head -n 1 \
            | tr -d ' :\r\n' \
            | tr '[:upper:]' '[:lower:]')
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "::error::Signer fingerprint mismatch for $(basename "$apk")"
            exit 1
          fi
          echo "Expected certificate SHA-256: $expected" | tee -a signing/SIGNING.txt
          echo "Certificate identity: verified" | tee -a signing/SIGNING.txt
          echo | tee -a signing/SIGNING.txt
        done < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0)
        [ "$found" -eq 1 ] || {
          echo "::error::No release APK was produced"
          exit 1
        }

    - name: Upload CI diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: x11manager-ci-diagnostics-${{ github.run_id }}
        if-no-files-found: warn
        path: |
          gradle-ci.log
          app/build/test-results/**/*.xml
          app/build/outputs/apk/release/output-metadata.json
          signing/SIGNING.txt

    - name: Stage & Rename Artifacts
      run: |
        set -euo pipefail
        TAG=$(cat .ci-release-tag)
        COMMIT_HASH=$(git log -1 --pretty=%h)
        VERSION_NAME=$(cat .ci-version-name)
        VERSION_CODE=$(cat .ci-version-code)
        mkdir -p dist
        found=0
        while IFS= read -r -d '' apk; do
          found=$((found + 1))
          original=$(basename "$apk" .apk)
          cp "$apk" "dist/X11Manager-${TAG}-${COMMIT_HASH}-${original}.apk"
        done < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print0 | sort -z)
        [ "$found" -eq 5 ] || {
          echo "::error::Expected 5 release APKs during staging; found $found"
          exit 1
        }
        cat > dist/BUILD-METADATA.txt <<EOF
        X11 Manager build metadata
        Tag: ${TAG}
        Commit: ${{ github.sha }}
        Version name: ${VERSION_NAME}
        Version code: ${VERSION_CODE}
        APK variants: armeabi-v7a, arm64-v8a, x86, x86_64, universal
        Workflow run: ${{ github.run_id }}
        EOF
        (
          cd dist
          sha256sum ./*.apk > SHA256SUMS.txt
        )
        if [ -s signing/SIGNING.txt ]; then
          cp signing/SIGNING.txt dist/SIGNING.txt
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: x11manager-artifacts
        path: dist/

    - name: Publish branch CI result
      if: ${{ always() && github.event_name == 'push' }}
      uses: actions/github-script@v7
      with:
        script: |
          const succeeded = '${{ job.status }}' === 'success';
          await github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: succeeded ? 'success' : 'failure',
            context: 'x11-manager-ci',
            description: succeeded
              ? 'Unit tests and release build passed'
              : 'Unit tests or release build failed',
            target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          })

  release:
    name: Create GitHub Release
    needs: [build]
    if: |
      needs.build.result == 'success' &&
      ((github.event_name == 'workflow_dispatch' &&
        github.event.inputs.create_release == 'true' &&
        github.event.inputs.tag_name != '' &&
        github.event.inputs.tag_name != 'test') ||
       startsWith(github.ref, 'refs/heads/release/'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive

    - name: Resolve release tag
      id: release_meta
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
          TAG="${GITHUB_REF#refs/heads/release/}"
        else
          TAG="${{ github.event.inputs.tag_name }}"
        fi
        if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid release tag: $TAG"
          exit 1
        fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Download Artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        merge-multiple: true

    - name: Generate Changelog
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        if [ -z "$PREV_TAG" ]; then
          CHANGELOG=$(git log --oneline --pretty=format:"* %s (%h)")
        else
          CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline --pretty=format:"* %s (%h)")
        fi
        {
          echo "notes<<EOF"
          echo "$CHANGELOG"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_meta.outputs.tag }}
        name: X11 Manager ${{ steps.release_meta.outputs.tag }}
        target_commitish: ${{ github.sha }}
        body: |
          ## What's Changed
          ${{ steps.changelog.outputs.notes }}

          ## Artifacts
          The release contains one APK for each supported ABI plus a universal APK.

          ## Verification
          Every published APK was verified with Android SDK `apksigner`, and its signer certificate SHA-256 fingerprint was matched against the repository's expected release certificate before this job was allowed to publish. SHA-256 file checksums, signer details, and build metadata are included with the assets.

          ---
          **Automated Release by X11 Manager CI**
        files: |
          release-assets/*.apk
          release-assets/SHA256SUMS.txt
          release-assets/SIGNING.txt
          release-assets/BUILD-METADATA.txt
