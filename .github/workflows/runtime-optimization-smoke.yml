name: Runtime Optimization Smoke

on:
  push:
    branches:
      - "test/build-optimization-benchmark"
  workflow_dispatch:

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  SAAS_NATIVE_LTO_LORIE: "0"
  SAAS_NATIVE_LTO_AVNC: "1"

jobs:
  smoke:
    name: Release + runtime optimization smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore native CMake state
        uses: actions/cache@v4
        with:
          path: |
            embedded-lorie/.cxx
            embedded-avnc/.cxx
          key: ${{ runner.os }}-native-cxx-opt-v2-${{ hashFiles('embedded-lorie/build.gradle', 'embedded-avnc/build.gradle', 'third_party/termux-x11/lorie/src/main/cpp/**', 'third_party/avnc/app/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-native-cxx-opt-v2-

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-opt-v2-${{ hashFiles('embedded-lorie/build.gradle', 'embedded-avnc/build.gradle', 'third_party/termux-x11/lorie/src/main/cpp/**', 'third_party/avnc/app/CMakeLists.txt', 'third_party/avnc/extern/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-opt-v2-

      - name: Install test tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             ccache pulseaudio pulseaudio-utils alsa-utils libasound2-plugins
          echo "CCACHE_EXECUTABLE=$(command -v ccache)" >> "$GITHUB_ENV"
          ccache --max-size "$CCACHE_MAXSIZE"
          ccache --zero-stats

      - name: Build DroidSpaces audio fixture
        run: |
          set -euo pipefail
          audio_fixture_dir="$RUNNER_TEMP/saas-audio-protocol"
          mkdir -p "$audio_fixture_dir"
          upstream="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/f60294ac4c8aa2cc860773ac85bc5790104eb77f/src"
          curl --fail --silent --show-error --location "$upstream/daemon.c" -o "$audio_fixture_dir/daemon.c"
          curl --fail --silent --show-error --location "$upstream/include/droidspace.h" -o "$audio_fixture_dir/droidspace.h"
          printf '%s  %s\n'             3357017c7c56bac0bd5fd76125f6534e3a51f2dd2b90aa65070a07c75be280eb "$audio_fixture_dir/daemon.c"             4cc3466f2cf799ba018d36b7067766452554b612e3fb1d9ec2915b0d80aafb1f "$audio_fixture_dir/droidspace.h" | sha256sum --check
          cc -O2 -ffunction-sections -fdata-sections -I"$audio_fixture_dir"             app/src/test/native/droidspaces_audio_request.c -Wl,--gc-sections             -o "$audio_fixture_dir/droidspaces-audio-request"
          echo "SAAS_DROIDSPACES_AUDIO_FIXTURE=$audio_fixture_dir/droidspaces-audio-request" >> "$GITHUB_ENV"

      - name: Verify benchmark Gradle model
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:tasks :baseline-profile:tasks --all --console=plain > benchmark-tasks.txt
          grep -E 'assembleBenchmark|generate.*BaselineProfile|Benchmark.*AndroidTest' benchmark-tasks.txt || true

      - name: Test and build optimized release
        env:
          SAAS_PULSE_INTEGRATION_REQUIRED: "1"
        run: |
          set -euo pipefail
          start=$(date +%s)
          ./gradlew testReleaseUnitTest assembleRelease             --build-cache --parallel --stacktrace             -PcomposeCompilerReports=true             -PVERSION_NAME=1.0.0-runtime-smoke             -PVERSION_CODE=${{ github.run_number }}             2>&1 | tee runtime-smoke.log
          end=$(date +%s)
          echo "$((end-start))" | tee runtime-smoke-seconds.txt

      - name: Validate 16 KB APK alignment
        run: |
          set -euo pipefail
          ZIPALIGN=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$ZIPALIGN" -c -P 16 -v 4 "$apk" >/dev/null
          done

      - name: Report native cache
        if: ${{ always() }}
        run: |
          ccache --show-stats --verbose | tee ccache-stats.txt || true

      - name: Collect diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p smoke/test-reports smoke/compose-compiler
          cp -f runtime-smoke.log smoke/ 2>/dev/null || true
          cp -f runtime-smoke-seconds.txt smoke/ 2>/dev/null || true
          cp -f benchmark-tasks.txt smoke/ 2>/dev/null || true
          cp -f ccache-stats.txt smoke/ 2>/dev/null || true
          cp -f app/build/outputs/mapping/release/mapping.txt smoke/ 2>/dev/null || true
          cp -a app/build/reports/tests/. smoke/test-reports/ 2>/dev/null || true
          find app/build/compose-compiler -type f -exec cp -f {} smoke/compose-compiler/ \; 2>/dev/null || true

      - name: Upload smoke diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            smoke/
            app/build/outputs/apk/release/*.apk


      - name: Upload APKs individually to GoFile
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_APK_ROOT: app/build/outputs/apk/release
        run: |
          set -euo pipefail
          if [ -z "${GOFILE_TOKEN:-}" ]; then
            echo "::warning::GOFILE_TOKEN repository secret is not configured; skipping GoFile upload."
            exit 0
          fi
          test -d "$GOFILE_APK_ROOT"
          mapfile -d '' apks < <(find "$GOFILE_APK_ROOT" -type f -name '*.apk' -print0 | sort -z)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK files found under $GOFILE_APK_ROOT"
            exit 1
          fi
          server_json="$(curl --silent --show-error --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors https://api.gofile.io/servers)"
          upload_server="$(printf '%s' "$server_json" | python3 -c 'import json,sys; j=json.load(sys.stdin); s=(j.get("data") or {}).get("servers") or []; print((s[0] or {}).get("name","") if s else "")')"
          test -n "$upload_server" || { echo "::error::GoFile returned no upload server"; exit 1; }
          upload_url="https://$upload_server.gofile.io/contents/uploadfile"
          folder_id=""
          folder_page=""
          uploaded=0
          summary="$RUNNER_TEMP/gofile-apks.md"
          : > "$summary"
          for apk in "${apks[@]}"; do
            args=(--silent --show-error --fail-with-body --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 900
              -H "Authorization: Bearer $GOFILE_TOKEN"
              -F "file=@$apk")
            if [ -n "$folder_id" ]; then
              args+=(-F "folderId=$folder_id")
            fi
            response="$(curl "${args[@]}" "$upload_url")"
            mapfile -t meta < <(printf '%s' "$response" | python3 -c 'import json,sys; j=json.load(sys.stdin); d=j.get("data") or {}; print(j.get("status","")); print(d.get("parentFolder") or d.get("folderId") or ""); print(d.get("downloadPage","")); print(d.get("parentFolderCode") or d.get("folderCode") or "")')
            status="${meta[0]:-}"
            parent="${meta[1]:-}"
            page="${meta[2]:-}"
            parent_code="${meta[3]:-}"
            if [ "$status" != "ok" ]; then
              echo "::error::GoFile rejected $(basename "$apk")"
              printf '%s\n' "$response" >&2
              exit 1
            fi
            if [ -z "$folder_id" ]; then folder_id="$parent"; fi
            if [ -z "$folder_page" ] && [ -n "$parent_code" ]; then folder_page="https://gofile.io/d/$parent_code"; fi
            name="$(basename "$apk")"
            if [ -n "$page" ]; then
              printf -- '- [%s](%s)\n' "$name" "$page" >> "$summary"
            else
              printf -- '- %s\n' "$name" >> "$summary"
            fi
            uploaded=$((uploaded + 1))
          done
          {
            echo "### GoFile — $uploaded APKs uploaded individually"
            [ -z "$folder_page" ] || echo "Folder: $folder_page"
            echo
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"