name: Android appearance tests

on:
  push:
    branches: [X11APP, X11TEST]
    paths:
      - 'app/src/main/java/com/saas/x11manager/ui/**'
      - 'app/src/main/java/com/saas/x11manager/MainActivity.kt'
      - 'app/src/main/res/**'
      - 'app/src/androidTest/**'
      - 'app/build.gradle.kts'
      - 'ci/run-appearance-tests.sh'
      - '.github/workflows/appearance-tests.yml'
  workflow_dispatch:

concurrency:
  group: appearance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  appearance:
    name: Appearance on Android API ${{ matrix.api }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [26, 31, 32, 34]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/cache@v4
        with:
          path: embedded-lorie/.cxx
          key: ${{ runner.os }}-appearance-native-${{ hashFiles('embedded-lorie/build.gradle', 'third_party/termux-x11/lorie/src/main/cpp/**') }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Build instrumentation APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pandroid.injected.build.abi=x86_64
      - name: Exercise themes and capture Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash ci/run-appearance-tests.sh "${{ matrix.api }}"
      - name: Publish screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-api-${{ matrix.api }}-${{ github.sha }}
          path: |
            appearance-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/


      - name: Upload APKs individually to GoFile
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
          GOFILE_APK_ROOT: app/build/outputs
        run: |
          set -euo pipefail
          if [ -z "${GOFILE_TOKEN:-}" ]; then
            echo "::warning::GOFILE_TOKEN repository secret is not configured; skipping GoFile upload."
            exit 0
          fi
          test -d "$GOFILE_APK_ROOT"
          mapfile -d '' apks < <(find "$GOFILE_APK_ROOT" -type f -name '*.apk' -print0 | sort -z)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No APK files found under $GOFILE_APK_ROOT"
            exit 1
          fi
          server_json="$(curl --silent --show-error --fail-with-body --retry 5 --retry-delay 3 --retry-all-errors https://api.gofile.io/servers)"
          upload_server="$(printf '%s' "$server_json" | python3 -c 'import json,sys; j=json.load(sys.stdin); s=(j.get("data") or {}).get("servers") or []; print((s[0] or {}).get("name","") if s else "")')"
          test -n "$upload_server" || { echo "::error::GoFile returned no upload server"; exit 1; }
          upload_url="https://$upload_server.gofile.io/contents/uploadfile"
          folder_id=""
          folder_page=""
          uploaded=0
          summary="$RUNNER_TEMP/gofile-apks.md"
          : > "$summary"
          for apk in "${apks[@]}"; do
            args=(--silent --show-error --fail-with-body --retry 8 --retry-delay 5 --retry-all-errors --connect-timeout 30 --max-time 900
              -H "Authorization: Bearer $GOFILE_TOKEN"
              -F "file=@$apk")
            if [ -n "$folder_id" ]; then
              args+=(-F "folderId=$folder_id")
            fi
            response="$(curl "${args[@]}" "$upload_url")"
            mapfile -t meta < <(printf '%s' "$response" | python3 -c 'import json,sys; j=json.load(sys.stdin); d=j.get("data") or {}; print(j.get("status","")); print(d.get("parentFolder") or d.get("folderId") or ""); print(d.get("downloadPage","")); print(d.get("parentFolderCode") or d.get("folderCode") or "")')
            status="${meta[0]:-}"
            parent="${meta[1]:-}"
            page="${meta[2]:-}"
            parent_code="${meta[3]:-}"
            if [ "$status" != "ok" ]; then
              echo "::error::GoFile rejected $(basename "$apk")"
              printf '%s\n' "$response" >&2
              exit 1
            fi
            if [ -z "$folder_id" ]; then folder_id="$parent"; fi
            if [ -z "$folder_page" ] && [ -n "$parent_code" ]; then folder_page="https://gofile.io/d/$parent_code"; fi
            name="$(basename "$apk")"
            if [ -n "$page" ]; then
              printf -- '- [%s](%s)\n' "$name" "$page" >> "$summary"
            else
              printf -- '- %s\n' "$name" >> "$summary"
            fi
            uploaded=$((uploaded + 1))
          done
          {
            echo "### GoFile — $uploaded APKs uploaded individually"
            [ -z "$folder_page" ] || echo "Folder: $folder_page"
            echo
            cat "$summary"
          } >> "$GITHUB_STEP_SUMMARY"