name: Rootfs Compatibility Matrix

on:
  push:
    branches: [ "main", "master", "agent/structural-fixes", "agent/integrated-x11", "agent/multi-display" ]
    paths:
      - "ci/rootfs-compatibility.sh"
      - "ci/wayland-arm64-compatibility.sh"
      - "ci/debian-apt-component-probe.sh"
      - "ci/export-graphic-session-plans.py"
      - "app/src/main/java/com/saas/x11manager/util/GraphicSessionInstallPlan.kt"
      - "app/src/main/java/com/saas/x11manager/util/AdditionalGraphicSessionInstaller.kt"
      - "app/src/main/java/com/saas/x11manager/util/WaylandGraphicSessionInstaller.kt"
      - "app/src/main/java/com/saas/x11manager/util/WaylandGraphicSessionSupport.kt"
      - "app/src/main/java/com/saas/x11manager/util/DebianAptComponentSource.kt"
      - "app/src/main/java/com/saas/x11manager/util/AptTransactionSafety.kt"
      - "app/src/main/java/com/saas/x11manager/util/ApkTransactionSafety.kt"
      - ".github/workflows/rootfs-compatibility.yml"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "ci/rootfs-compatibility.sh"
      - "ci/wayland-arm64-compatibility.sh"
      - "ci/debian-apt-component-probe.sh"
      - "ci/export-graphic-session-plans.py"
      - "app/src/main/java/com/saas/x11manager/util/GraphicSessionInstallPlan.kt"
      - "app/src/main/java/com/saas/x11manager/util/AdditionalGraphicSessionInstaller.kt"
      - "app/src/main/java/com/saas/x11manager/util/WaylandGraphicSessionInstaller.kt"
      - "app/src/main/java/com/saas/x11manager/util/WaylandGraphicSessionSupport.kt"
      - "app/src/main/java/com/saas/x11manager/util/DebianAptComponentSource.kt"
      - "app/src/main/java/com/saas/x11manager/util/AptTransactionSafety.kt"
      - "app/src/main/java/com/saas/x11manager/util/ApkTransactionSafety.kt"
      - ".github/workflows/rootfs-compatibility.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rootfs-compatibility:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Alpine current
            slug: alpine-current
            image: alpine:latest
          - name: Debian stable
            slug: debian-stable
            image: debian:stable-slim
          - name: Ubuntu current
            slug: ubuntu-current
            image: ubuntu:latest
    steps:
      - uses: actions/checkout@v4

      - name: Export graphic session plan catalog
        run: |
          python3 -m py_compile ci/export-graphic-session-plans.py
          python3 ci/export-graphic-session-plans.py \
            --output "${RUNNER_TEMP}/graphic-session-plans.tsv"
          test -s "${RUNNER_TEMP}/graphic-session-plans.tsv"
          awk -F '\t' 'NF != 5 { exit 1 } END { if (NR < 1) exit 1 }' \
            "${RUNNER_TEMP}/graphic-session-plans.tsv"

      - name: Validate compatibility probe syntax
        run: |
          sh -n ci/rootfs-compatibility.sh
          sh -n ci/wayland-arm64-compatibility.sh
          sh -n ci/debian-apt-component-probe.sh

      - name: Validate current rootfs package compatibility
        run: |
          mkdir -p "${RUNNER_TEMP}/rootfs-audit"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -v "${RUNNER_TEMP}/graphic-session-plans.tsv:/graphic-session-plans.tsv:ro" \
            -v "${RUNNER_TEMP}/rootfs-audit:/audit" \
            -e GRAPHIC_SESSION_PLAN_CATALOG=/graphic-session-plans.tsv \
            -e ROOTFS_AUDIT_REPORT="/audit/${{ matrix.slug }}.tsv" \
            -w /workspace \
            "${{ matrix.image }}" \
            sh ci/rootfs-compatibility.sh
          test -s "${RUNNER_TEMP}/rootfs-audit/${{ matrix.slug }}.tsv"
          cat "${RUNNER_TEMP}/rootfs-audit/${{ matrix.slug }}.tsv"

      - name: Validate Debian non-free component capability
        if: ${{ matrix.slug == 'debian-stable' }}
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            "${{ matrix.image }}" \
            sh ci/debian-apt-component-probe.sh

      - name: Upload rootfs catalog audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-catalog-audit-${{ matrix.slug }}-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/rootfs-audit/${{ matrix.slug }}.tsv

  wayland-arm64:
    name: Wayland ARM64 · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Alpine current
            image: alpine:latest
          - name: Debian stable
            image: debian:stable-slim
          - name: Ubuntu current
            image: ubuntu:latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable ARM64 container emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Validate ARM64 Wayland probe syntax
        run: sh -n ci/wayland-arm64-compatibility.sh

      - name: Verify current ARM64 Wayland package set
        run: |
          docker run --rm \
            --platform linux/arm64 \
            -v "${GITHUB_WORKSPACE}:/workspace:ro" \
            -w /workspace \
            "${{ matrix.image }}" \
            sh ci/wayland-arm64-compatibility.sh

  publish-status:
    name: Publish compatibility status
    if: ${{ always() && github.event_name == 'push' }}
    needs: [rootfs-compatibility, wayland-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish rootfs compatibility result
        uses: actions/github-script@v7
        with:
          script: |
            const rootfsSucceeded = '${{ needs.rootfs-compatibility.result }}' === 'success';
            const arm64Succeeded = '${{ needs.wayland-arm64.result }}' === 'success';
            const succeeded = rootfsSucceeded && arm64Succeeded;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: succeeded ? 'success' : 'failure',
              context: 'rootfs-compatibility',
              description: succeeded
                ? 'Current rootfs and ARM64 Wayland package audits passed'
                : 'A rootfs or ARM64 Wayland compatibility probe failed',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
